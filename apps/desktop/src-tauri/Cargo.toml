[package]
name = "actionloop-desktop"
version = "0.1.0-beta.1"
description = "ActionLoop Windows 桌面端（Tauri 2，复用 Web 前端）"
authors = ["ActionLoop Team"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "actionloop_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
