name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    env:
      # 集成测试连接参数：指向下方 service 容器（@EnabledIfTestInfra 不可达时自动跳过）
      ACTIONLOOP_TEST_PG_HOST: 127.0.0.1
      ACTIONLOOP_TEST_PG_PORT: '5433'
      ACTIONLOOP_TEST_PG_DB: actionloop_test
      ACTIONLOOP_TEST_PG_USER: postgres
      ACTIONLOOP_TEST_PG_PASSWORD: actionloop_dev
      ACTIONLOOP_TEST_REDIS_HOST: 127.0.0.1
      ACTIONLOOP_TEST_REDIS_PORT: '6379'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: actionloop_dev
          POSTGRES_DB: actionloop_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Make wrapper executable
        run: chmod +x mvnw
      - name: Build & test
        run: ./mvnw -pl shared,api,worker -am test -B -ntp
      - name: Package executable jar
        run: ./mvnw -pl api package -DskipTests -B -ntp

  web:
    name: Web (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck & build
        run: pnpm --filter @actionloop/web build
      - name: Test
        run: pnpm --filter @actionloop/web test

  desktop:
    name: Desktop (Tauri / cargo check)
    runs-on: windows-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build web dist (for tauri generate_context)
        run: pnpm --filter @actionloop/web build
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: cargo check
        run: cargo check
        working-directory: apps/desktop/src-tauri

  android:
    name: Android (assembleDebug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: actionloop-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
