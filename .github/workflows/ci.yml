name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    env:
      # 集成测试连接参数：指向下方 service 容器（@EnabledIfTestInfra 不可达时自动跳过）
      ACTIONLOOP_TEST_PG_HOST: 127.0.0.1
      ACTIONLOOP_TEST_PG_PORT: '5433'
      ACTIONLOOP_TEST_PG_DB: actionloop_test
      ACTIONLOOP_TEST_PG_USER: postgres
      ACTIONLOOP_TEST_PG_PASSWORD: actionloop_dev
      ACTIONLOOP_TEST_REDIS_HOST: 127.0.0.1
      ACTIONLOOP_TEST_REDIS_PORT: '6379'
    services:
      postgres:
        # 默认 Flyway 包含 pgvector 迁移（migration-vector），CI 库必须预装 vector 扩展
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: actionloop_dev
          POSTGRES_DB: actionloop_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Make wrapper executable
        run: chmod +x mvnw
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build & test
        run: |
          # 清理旧报告，避免被历史 error/skip 污染统计
          rm -rf api/target/surefire-reports worker/target/surefire-reports shared/target/surefire-reports
          ./mvnw -pl shared,api,worker -am test -B -ntp
      - name: Hard-fail on skipped integration tests
        run: |
          python3 -c "
          import glob, re, sys
          txts = glob.glob('api/target/surefire-reports/*.txt') + glob.glob('worker/target/surefire-reports/*.txt') + glob.glob('shared/target/surefire-reports/*.txt')
          total_skip = 0
          for t in txts:
              with open(t, encoding='utf-8', errors='ignore') as f:
                  for line in f:
                      m = re.search(r'Tests run: (\d+), Failures: (\d+), Errors: (\d+), Skipped: (\d+)', line)
                      if m:
                          total_skip += int(m.group(4))
          # 允许 1 条有明确说明的跳过（HybridSearchIntegrationTest 无 MaaS 凭证时 assumeTrue 跳过）
          if total_skip > 1:
              print(f'FAIL: {total_skip} tests skipped (> 1 allowed). Investigate @EnabledIfTestInfra / assumeTrue gaps.')
              sys.exit(1)
          print(f'OK: {total_skip} skipped (≤ 1 allowed)')
          "
      - name: Package executable jar
        run: ./mvnw -pl api package -DskipTests -B -ntp

  web:
    name: Web (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck & build
        run: pnpm --filter @actionloop/web build
      - name: Test
        run: pnpm --filter @actionloop/web test

  web-e2e:
    name: Web E2E (Chromium / real API)
    runs-on: ubuntu-latest
    needs: [backend, web]
    env:
      ACTIONLOOP_E2E_DB_HOST: 127.0.0.1
      ACTIONLOOP_E2E_DB_PORT: '5433'
      ACTIONLOOP_E2E_DB_NAME: actionloop_e2e
      ACTIONLOOP_E2E_DB_USER: postgres
      ACTIONLOOP_E2E_DB_PASSWORD: actionloop_e2e
      ACTIONLOOP_E2E_REDIS_HOST: 127.0.0.1
      ACTIONLOOP_E2E_REDIS_PORT: '6379'
      ACTIONLOOP_E2E_REDIS_PASSWORD: ''
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: actionloop_e2e
          POSTGRES_DB: actionloop_e2e
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Make wrapper executable
        working-directory: services
        run: chmod +x mvnw
      - name: Package executable API jar
        working-directory: services
        run: ./mvnw -pl api -am package -DskipTests -B -ntp
      - name: Install Chromium
        run: pnpm --filter @actionloop/web exec playwright install --with-deps chromium
      - name: Run real Web E2E
        run: pnpm test:e2e
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actionloop-web-e2e-report
          path: apps/web/playwright-report
          if-no-files-found: error
          retention-days: 7
      - name: Upload Playwright traces and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actionloop-web-e2e-results
          path: apps/web/test-results
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Desktop (Tauri / cargo check)
    runs-on: windows-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build web dist (for tauri generate_context)
        run: pnpm --filter @actionloop/web build
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: cargo check
        run: cargo check
        working-directory: apps/desktop/src-tauri

  android:
    name: Android (assembleDebug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Build debug APK & run JVM unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actionloop-android-unit-tests
          path: apps/android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: actionloop-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
