# ActionLoop 本地开发编排（指导书附录 E 入口）
# 用法：docker compose --env-file .env.local -f infra/compose/docker-compose.local.yml up -d postgres redis minio
# 生产与 staging 使用独立 compose（不在本文件）。本文件只用于本地，不连接生产桶或生产模型密钥。
name: actionloop-local

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: actionloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ACTIONLOOP_DB_NAME:-actionloop}
      POSTGRES_USER: ${ACTIONLOOP_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${ACTIONLOOP_DB_PASSWORD:?必须在 .env.local 设置 ACTIONLOOP_DB_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${ACTIONLOOP_DB_PORT:-5432}:5432"
    volumes:
      - actionloop-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ACTIONLOOP_DB_USER:-postgres} -d ${ACTIONLOOP_DB_NAME:-actionloop}"]
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=vector"

  redis:
    image: redis:7-alpine
    container_name: actionloop-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${ACTIONLOOP_REDIS_PASSWORD:-}"]
    ports:
      - "${ACTIONLOOP_REDIS_PORT:-6379}:6379"
    volumes:
      - actionloop-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${ACTIONLOOP_REDIS_PASSWORD:-}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: actionloop-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${ACTIONLOOP_S3_ACCESS_KEY:-actionloop_minio_dev}
      MINIO_ROOT_PASSWORD: ${ACTIONLOOP_S3_SECRET_KEY:?必须在 .env.local 设置 ACTIONLOOP_S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - actionloop-miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live || wget -qO- http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Coturn 与 Caddy 在阶段 5（远程协助）启用，此处保留占位注释，避免阶段 1 引入未验证依赖
  # coturn: image: coturn/coturn ...
  # caddy: image: caddy:2 ...

volumes:
  actionloop-pgdata:
  actionloop-redisdata:
  actionloop-miniodata:
